name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # mise.toml に書いた Node / pnpm のバージョンをそのまま使う
      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build & deploy dry-run
        run: pnpm check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Storybook の vitest browser mode はコールドキャッシュの初回だけ落ちることがある
      # （docs/storybook-vitest-first-run-flake.md）。Vite の依存最適化結果を持ち越して
      # 実行を安定させる。
      - name: Cache Vite / Storybook deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache/storybook
          key: vite-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.config.ts', '.storybook/**') }}
          restore-keys: |
            vite-cache-${{ runner.os }}-

      - name: Run tests
        run: pnpm test
