name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml に書いた Node / pnpm のバージョンをそのまま使う
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build & deploy dry-run
        run: pnpm check

      # chromium-headless-shell のみをインストールする（chromium 指定だと
      # ヘッドフル版も一緒に落ちてくる）。--with-deps（apt 経由の依存インストール）
      # は GitHub Actions の ubuntu ランナーでは不要なため外し、install 自体が
      # 数秒で終わるのでキャッシュも持たない。
      - name: Install Playwright browsers
        run: pnpm exec playwright install --only-shell chromium

      # Storybook の vitest browser mode はコールドキャッシュの初回だけ落ちることがある
      # （docs/storybook-vitest-first-run-flake.md）。Vite の依存最適化結果を持ち越して
      # 実行を安定させる。
      - name: Cache Vite / Storybook deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.vite
            node_modules/.cache/storybook
          key: vite-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.config.ts', '.storybook/**') }}
          restore-keys: |
            vite-cache-${{ runner.os }}-

      - name: Run tests
        run: pnpm test
